[project]
name = "essentials-tests"
version = "0.1.0"
description = "In game tests of the Essentials plugin on a Magnetar server, driven through the Remote plugin"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pytest>=8.0",
    "pytest-xdist>=3.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Keeps the tests of an xdist_group on one worker when run with -n
addopts = "--dist loadgroup"

[tool.uv]
package = false

[tool.black]
target-version = ["py312"]
